server {
    server_name mattgreat.house;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

    # HTML, sitemap, and robots revalidate on every visit so a new deploy is visible promptly.
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # Vite fingerprints files in this directory, so each URL is safe to cache indefinitely.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Public files retain stable URLs; cache them for a month while allowing refreshes after updates.
    location ~* \.(?:avif|gif|ico|jpe?g|pdf|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/mattgreat.house/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mattgreat.house/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = mattgreat.house) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name mattgreat.house;
    return 404; # managed by Certbot
}
